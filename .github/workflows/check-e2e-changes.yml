name: Check E2E-relevant changes
on:
  workflow_call:
    inputs:
      force:
        description: "Run whatever changed, as before a nightly or release build"
        type: boolean
        default: false
    outputs:
      should_run:
        description: "Whether the e2e job should run"
        value: ${{ jobs.changes.outputs.should_run }}

jobs:
  changes:
    name: Check for relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ inputs.force || github.event_name == 'workflow_dispatch' || steps.filter.outputs.e2e == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.force && github.event_name != 'workflow_dispatch' }}
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: ${{ !inputs.force && github.event_name != 'workflow_dispatch' }}
        id: filter
        with:
          # The e2e suites drive the Tauri app, so they run only when it changes, not
          # for CI changes alone: they're slow, and nightly and release builds run them
          # regardless. quality.but.dev checks the rest. Keep in sync with the tauri_gui
          # filter in push.yaml, which also counts CI's own files.
          filters: |
            e2e:
              - 'apps/desktop/**'
              - 'crates/gitbutler-tauri/**'
              - 'packages/ui-svelte/**'
              - 'packages/shared/**'
              - 'packages/core/**'
              - 'e2e/**'
