name: "Publish"
on:
  schedule:
    # every day at 1am UTC, 3AM CEST or 2AM CET.
    - cron: "0 1 * * *"

  workflow_dispatch:
    inputs:
      channel:
        type: choice
        required: true
        description: channel
        default: nightly
        options:
          - release
          - nightly
      bump:
        type: choice
        required: true
        description: update type
        default: patch
        options:
          - undefined
          - patch
          - minor
          - major
      dry_run:
        description: Perform a dry run that builds the artifacts and uploads them to GitHub, but does not publish them to end users. Useful to test experimental features before they go out in a nightly.
        type: boolean
        required: true
        default: false
      skip_tests:
        description: Build without running the Tauri app's tests first. For emergencies only.
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  # The Tauri app's whole test suite, before anything is built or published. Pull requests
  # run these only when the app's own files change (quality.but.dev checks the rest), so a break
  # that comes from shared code is caught here at the latest.
  test-tauri:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/gitbutlerapp/ci-base-image@sha256:3eaeae1b07072796a53dc1e7585cdc1f462d0b11d10ecd3685c6fa8082d647dd
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-test-tauri
          save-if: false
      - name: Install Zig
        uses: $/.github/actions/setup-zig
      # The same checks as push.yaml's rust-lint and rust-test-tauri.
      - name: cargo clippy -p gitbutler-tauri
        run: |
          rustup component add clippy
          cargo clippy -p gitbutler-tauri --all-targets -- -D warnings
          cargo clippy -p gitbutler-tauri --all-targets --no-default-features -- -D warnings
          cargo clippy -p gitbutler-tauri --all-targets --all-features -- -D warnings
      - name: Test but-api-macros --features tauri
        run: cargo test -p but-api-macros-tests --features tauri
      - name: Check Tauri app features
        run: |
          set -e
          cargo check -p gitbutler-tauri --no-default-features
          for feature in devtools custom-protocol error-context packaged-but-distribution builtin-but; do
            cargo check -p gitbutler-tauri --no-default-features --features "$feature"
          done

  # The desktop frontend and the packages it uses: lint, type checks and unit tests.
  test-frontend:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/init-env-node
      - id: get_playwright_version
        shell: bash
        run: |
          version=$(pnpm --filter @gitbutler/ui-svelte --fail-if-no-match exec node -p 'require("playwright/package.json").version')
          echo "playwright-version=v$version" >> "$GITHUB_OUTPUT"
      - name: Cache playwright binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.get_playwright_version.outputs.playwright-version }}
      - run: pnpm ui:playwright:install:unit
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

  # Every e2e suite, whatever changed.
  test-e2e:
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/test-e2e.yml
    with:
      before_publish: true
    secrets:
      TEST_RESULTS_TOKEN_BLACKBOX: ${{ secrets.TEST_RESULTS_TOKEN_BLACKBOX }}
      TEST_RESULTS_TOKEN_PLAYWRIGHT: ${{ secrets.TEST_RESULTS_TOKEN_PLAYWRIGHT }}
    permissions:
      contents: read
      packages: read
      pull-requests: read

  build-sveltekit:
    # Skipped tests (skip_tests) don't block the build; failed or cancelled ones do.
    needs: [test-tauri, test-frontend, test-e2e]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Consume input variables
        shell: bash
        run: |
          VITEMODE=nightly
          if [[ "${{ github.event.inputs.channel }}" == "release" ]]; then
            VITEMODE=production
          fi

          echo "vitemode=$VITEMODE" >> $GITHUB_ENV
          echo "channel=${{ github.event.inputs.channel || 'nightly' }}" >> $GITHUB_ENV
          echo "bump=${{ github.event.inputs.bump || 'patch' }}" >> $GITHUB_ENV
      - name: Calculate next version
        shell: bash
        run: |
          CURRENT_VERSION="$(curl --silent "https://app.gitbutler.com/releases/${{ env.channel }}" | jq -r '.version')"
          NEXT_VERSION=$(./scripts/next.sh "${CURRENT_VERSION}" "${{ env.bump }}")
          echo "version=$NEXT_VERSION" >> $GITHUB_ENV
          mkdir -p release && echo "$NEXT_VERSION" > release/version

      - name: Check AppStream metadata contains release entry for next version
        if: runner.os == 'Linux' && env.channel == 'release'
        env:
          VERSION: ${{ env.version }}
        run: |
          sudo apt update && sudo apt install -y xmlstarlet
          ./scripts/check-appstream-metadata.sh "$VERSION" "./crates/gitbutler-tauri/com.gitbutler.gitbutler.metainfo.xml"

      - name: Init Node Environment
        uses: ./.github/actions/init-env-node
      - name: Build SvelteKit
        run: pnpm build:desktop -- --mode ${{ env.vitemode }}
        env:
          SENTRY_RELEASE: ${{ env.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload SvelteKit build output
        with:
          name: sveltekit-build
          path: ./apps/desktop/build/
          retention-days: 1
          if-no-files-found: error

  build-tauri:
    needs: build-sveltekit
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-private-repositories
        include:
          - platform: macos-15 # [macOs, ARM64] - default target
            target: ""
          - platform: macos-15 # [macOs, x64] - cross-compile
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04 # [linux, x64]
            target: ""
          - platform: ubuntu-22.04-arm # [linux, ARM64]
            target: ""
          - platform: windows-latest # [windows, x64]
            target: ""

    runs-on: ${{ matrix.platform }}

    outputs:
      platform: ${{ matrix.platform }}
      channel: ${{ env.channel }}

    steps:
      # Because GitHub broke perl installations sometime in 2022 on Windows.
      - name: perl -V (before re-install)
        if: runner.os == 'Windows'
        run: which perl && perl -V
      - name: Set git to use LF
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: perl -V
        if: runner.os == 'Windows'
        run: which perl && perl -V
      - name: Set Perl environment variables
        if: runner.os == 'Windows'
        run: |
          echo "PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "OPENSSL_SRC_PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set Cargo build target to ${{ matrix.target }}
        shell: bash
        if: matrix.target != ''
        run: |
          echo "CARGO_BUILD_TARGET=${{ matrix.target }}" >> $GITHUB_ENV
          rustup target add ${{ matrix.target }}
      # The cache doesn't pick up the environment variable set above, so we have to set it ourselves.
      - name: Rust Cache ${{ matrix.target }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # One cache for both channels: their builds differ only in the nightly feature.
          shared-key: app-release-build-${{ matrix.target }}${{ matrix.platform }}
      - name: Install Zig
        uses: $/.github/actions/setup-zig
      - name: Init Node Environment
        uses: ./.github/actions/init-env-node

      - name: Consume input variables
        shell: bash
        run: |
          echo "channel=${{ github.event.inputs.channel || 'nightly' }}" >> $GITHUB_ENV
          echo "bump=${{ github.event.inputs.bump || 'patch' }}" >> $GITHUB_ENV

      - name: Calculate next version
        shell: bash
        run: |
          CURRENT_VERSION="$(curl --silent "https://app.gitbutler.com/releases/${{ env.channel }}" | jq -r '.version')"
          NEXT_VERSION=$(./scripts/next.sh "${CURRENT_VERSION}" "${{ env.bump }}")
          echo "version=$NEXT_VERSION" >> $GITHUB_ENV
          mkdir -p release && echo "$NEXT_VERSION" > release/version

      - name: Import GPG key
        if: runner.os == 'Linux'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.APPIMAGE_PRIVATE_KEY }}
          passphrase: ${{ secrets.APPIMAGE_KEY_PASSPHRASE }}

      - name: Install linux dependencies
        shell: bash
        if: runner.os == 'Linux'
        run: |
          sudo apt update;
          sudo apt install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxkbcommon-x11-dev \
            xdg-utils;

          webkit_version='2.50.*'
          sudo apt install -y \
            libwebkit2gtk-4.1-0="$webkit_version" \
            libwebkit2gtk-4.1-dev="$webkit_version" \
            libjavascriptcoregtk-4.1-0="$webkit_version" \
            libjavascriptcoregtk-4.1-dev="$webkit_version" \
            gir1.2-javascriptcoregtk-4.1="$webkit_version" \
            gir1.2-webkit2-4.1="$webkit_version";

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        name: Download SvelteKit build output
        with:
          name: sveltekit-build
          path: ./apps/desktop/build/
      - name: Build MCP apps
        run: pnpm --filter @gitbutler/but-mcp-app build
      - name: Build binary
        shell: bash
        run: |
          ./scripts/release.sh \
            --sign \
            --channel                    "${{ env.channel }}" \
            --dist                       "./release" \
            --version                    "${{ env.version }}"
        env:
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPIMAGE_KEY_ID: ${{ secrets.APPIMAGE_KEY_ID }}
          APPIMAGE_KEY_PASSPHRASE: ${{ secrets.APPIMAGE_KEY_PASSPHRASE }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

      # Profiling build for debugging purposes
      - name: Build profiling CLI
        if: matrix.platform == 'ubuntu-22.04' && env.channel == 'nightly'
        shell: bash
        env:
          VERSION: ${{ env.version }}
          CHANNEL: nightly
          GITBUTLER_REQUIRE_MCP_APP: "1"
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_PROFILE_RELEASE_DEBUG: "2"
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
        run: |
          cargo build --locked --release -p but --bin but \
            --features nightly \
            --target x86_64-unknown-linux-gnu \
            --target-dir target/profiling

          binary=target/profiling/x86_64-unknown-linux-gnu/release/but
          "$binary" --version
          readelf -S --wide "$binary" | grep '\.debug_info' >/dev/null

          mkdir -p profiling
          tar -czf profiling/but-profiling.tar.gz \
            -C "$(dirname "$binary")" but

      - name: Upload profiling artifact
        if: matrix.platform == 'ubuntu-22.04' && env.channel == 'nightly'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "profiling-nightly-linux-x86_64-${{ github.run_number }}"
          path: profiling/but-profiling.tar.gz
          if-no-files-found: error

      - name: Set artifact name suffix
        shell: bash
        run: |
          # Only add suffix for macOS x86_64 to distinguish from ARM64
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            echo "artifact_suffix=-x86_64" >> $GITHUB_ENV
          else
            echo "artifact_suffix=" >> $GITHUB_ENV
          fi
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.channel }}-${{ matrix.platform }}${{ env.artifact_suffix }}-${{ github.run_number }}"
          path: release/
          if-no-files-found: error

      - name: Prepare Windows Aux Binary Artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rm -rf tauri-aux-artifacts
          mkdir -p tauri-aux-artifacts
          cp target/release/gitbutler-git-askpass.exe tauri-aux-artifacts/

      - name: Upload Windows Aux Binary Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows'
        with:
          name: "${{ env.channel }}-windows-aux-${{ github.run_number }}"
          path: tauri-aux-artifacts/
          if-no-files-found: error

  sign-windows:
    needs: build-tauri
    runs-on: [self-hosted, evcodesignd]
    # When the signing machine is offline, jobs queue for up to 24h; let each
    # newer run cancel the previous stuck one instead of stacking behind it.
    concurrency:
      group: sign-windows-${{ github.event.inputs.channel || 'nightly' }}
      cancel-in-progress: true
    strategy:
      matrix:
        platform:
          - windows-latest # [windows, x64]
    steps:
      - name: Clean artifact directory
        shell: bash
        run: rm -rf release
      - name: Download unsigned artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "${{ needs.build-tauri.outputs.channel }}-${{ matrix.platform }}-${{ github.run_number }}"
          path: release
      - name: Sign Windows binary
        shell: bash
        run: |
          find release -name "*.msi" -type f -print0 | xargs -0 -n1 -I{} python3 /sign-with-evcodesignd.py "{}"
        env:
          EVCODESIGND_PSK: ${{ secrets.EVCODESIGND_PSK }}
      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ needs.build-tauri.outputs.channel }}-${{ matrix.platform }}-${{ github.run_number }}"
          path: release/
          if-no-files-found: error
          overwrite: true

  sign-tauri:
    needs: [sign-windows, build-tauri]
    runs-on: windows-latest
    strategy:
      matrix:
        platform:
          - windows-latest # [windows, x64]
    steps:
      - name: Clean artifact directory
        shell: bash
        run: rm -rf release
      - name: Download ev-signed artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "${{ needs.build-tauri.outputs.channel }}-${{ matrix.platform }}-${{ github.run_number }}"
          path: release
      - name: Set file as a variable
        shell: bash
        id: set-path
        run: |
          msi_file=$(find release -name "*.msi" -type f -printf '%P\n')
          echo "msi_file=$msi_file" >> $GITHUB_OUTPUT
      - name: Sign our EV signed file
        shell: bash
        run: |
          set -x
          curl -O https://gitbutler-public.s3.us-east-1.amazonaws.com/_win/minisign.exe
          chmod +x minisign.exe  # Add this line to make the file executable
          echo "sign release/${{ steps.set-path.outputs.msi_file }}"
          timestamp=$(date +%s)
          TRUSTED_COMMENT="timestamp:$timestamp	file:${{ steps.set-path.outputs.msi_file }}"
          UNTRUSTED_COMMENT="signature from tauri secret key"
          echo "${{ secrets.TAURI_PRIVATE_KEY }}" >> ./minisign.key.b64
          perl -MMIME::Base64 -ne 'print decode_base64($_)' ./minisign.key.b64 > minisign.key
          echo ${{ secrets.TAURI_KEY_PASSWORD }} | ./minisign.exe -S -s minisign.key -t "$TRUSTED_COMMENT" -c "$UNTRUSTED_COMMENT" -m "release/${{ steps.set-path.outputs.msi_file }}"
          perl -MMIME::Base64 -0777 -ne 'print encode_base64($_, "")' < "release/${{ steps.set-path.outputs.msi_file }}.minisig" > "release/${{ steps.set-path.outputs.msi_file }}.sig"
          rm "release/${{ steps.set-path.outputs.msi_file }}.minisig"
          rm "release/${{ steps.set-path.outputs.msi_file }}.zip"
      - name: Compress files into a ZIP archive
        run: |
          Compress-Archive -Force -Path "release/${{ steps.set-path.outputs.msi_file }}" -DestinationPath "release/${{ steps.set-path.outputs.msi_file }}.zip"
      - name: Upload re-signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ needs.build-tauri.outputs.channel }}-${{ matrix.platform }}-${{ github.run_number }}"
          path: release/
          if-no-files-found: error
          overwrite: true

  sign-but:
    needs: build-tauri
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # we currently only run this for Linux builds, as we only publish a standalone but binary for those
          - platform: ubuntu-22.04 # [linux, x64]
          - platform: ubuntu-22.04-arm # [linux, ARM64]
    steps:
      - name: Clean artifact directory
        shell: bash
        run: rm -rf release
      - name: Download unsigned artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "${{ needs.build-tauri.outputs.channel }}-${{ matrix.platform }}-${{ github.run_number }}"
          path: release
      - name: Sign but binary with minisign
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          but_file=$(find release -name "but" -type f -printf '%P\n')

          echo "sign release/$but_file"
          timestamp=$(date +%s)
          TRUSTED_COMMENT="timestamp:$timestamp	file:$but_file"
          UNTRUSTED_COMMENT="signature from tauri secret key"
          echo "${{ secrets.TAURI_PRIVATE_KEY }}" | base64 -d > minisign.key
          echo "${{ secrets.TAURI_KEY_PASSWORD }}" | minisign -S -s minisign.key -t "$TRUSTED_COMMENT" -c "$UNTRUSTED_COMMENT" -m "release/$but_file"

          # there's no particularly good reason to base64 encode this file given its current usage, we do it only to
          # be consistent with how we treat signatures (which are always base64 encoded at present)
          base64 -w 0 < "release/$but_file.minisig" > "release/$but_file.sig"
          rm "release/$but_file.minisig"
          rm minisign.key
      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ needs.build-tauri.outputs.channel }}-${{ matrix.platform }}-${{ github.run_number }}"
          path: release/
          if-no-files-found: error
          overwrite: true

  # macOS and Linux only; Windows is published separately in publish-windows so
  # an offline Windows signing machine does not block the other platforms.
  publish-tauri:
    needs: [sign-but, build-tauri]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.version }}
    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-private-repositories
        include:
          - platform: macos-15 # [macOs, ARM64] - default target
            target: ""
          - platform: macos-15 # [macOs, x64] - cross-compile
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04 # [linux, x64]
            target: ""
          - platform: ubuntu-22.04-arm # [linux, ARM64]
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set artifact name suffix
        shell: bash
        run: |
          # Only add suffix for macOS x86_64 to distinguish from ARM64
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            echo "artifact_suffix=-x86_64" >> $GITHUB_ENV
          else
            echo "artifact_suffix=" >> $GITHUB_ENV
          fi
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "${{ needs.build-tauri.outputs.channel }}-${{ matrix.platform }}${{ env.artifact_suffix }}-${{ github.run_number }}"
          path: release
      - name: Extract version
        shell: bash
        run: |
          VERSION="$(cat release/version)"
          echo "version=$VERSION" >> $GITHUB_ENV
      - name: Prepare S3 payload
        shell: bash
        run: |
          rm -rf release-s3
          mkdir -p release-s3
          rsync -avE --prune-empty-dirs --include-from='.github/workflows/publish.include.txt' --exclude='*' release/ release-s3/
          bash scripts/normalize-spaces.sh ./release-s3
      - uses: shallwefootball/s3-upload-action@0d261a6f15b3b2e209dfebdecace4b100c04f95b # commit 0d261a6
        name: Upload To S3
        id: S3
        with:
          aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_bucket: "releases.gitbutler.com"
          source_dir: "release-s3/"
          destination_dir: "releases/${{ needs.build-tauri.outputs.channel }}/${{ env.version }}-${{ github.run_number }}"

      - name: Download profiling artifact
        if: matrix.platform == 'ubuntu-22.04' && needs.build-tauri.outputs.channel == 'nightly'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "profiling-nightly-linux-x86_64-${{ github.run_number }}"
          path: profiling
      - name: Upload profiling artifact to S3
        if: matrix.platform == 'ubuntu-22.04' && needs.build-tauri.outputs.channel == 'nightly'
        uses: shallwefootball/s3-upload-action@0d261a6f15b3b2e209dfebdecace4b100c04f95b # commit 0d261a6
        with:
          aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_bucket: "releases.gitbutler.com"
          source_dir: "profiling/"
          destination_dir: "profiling/nightly/${{ env.version }}-${{ github.run_number }}"

  publish-windows:
    needs: [sign-tauri, build-tauri]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "${{ needs.build-tauri.outputs.channel }}-windows-latest-${{ github.run_number }}"
          path: release
      - name: Extract version
        shell: bash
        run: |
          VERSION="$(cat release/version)"
          echo "version=$VERSION" >> $GITHUB_ENV
      - name: Prepare S3 payload
        shell: bash
        run: |
          rm -rf release-s3
          mkdir -p release-s3
          rsync -avE --prune-empty-dirs --include-from='.github/workflows/publish.include.txt' --exclude='*' release/ release-s3/
          bash scripts/normalize-spaces.sh ./release-s3
      - uses: shallwefootball/s3-upload-action@0d261a6f15b3b2e209dfebdecace4b100c04f95b # commit 0d261a6
        name: Upload To S3
        id: S3
        with:
          aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_bucket: "releases.gitbutler.com"
          source_dir: "release-s3/"
          destination_dir: "releases/${{ needs.build-tauri.outputs.channel }}/${{ env.version }}-${{ github.run_number }}"

  # Turns a Windows-less release run red (nightlies may ship without Windows).
  # Recovery: re-run the failed jobs once the signing machine is back.
  require-windows-for-release:
    needs: [build-tauri, publish-windows]
    if: ${{ !cancelled() && github.event.inputs.channel == 'release' && github.event.inputs.dry_run == 'false' }}
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require a published Windows build
        shell: bash
        env:
          RESULT: ${{ needs.publish-windows.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "publish-windows did not succeed (result: $RESULT), which blocks a release."
            exit 1
          fi

  notify-gitbutler-api:
    needs: [build-tauri, publish-tauri]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Notify GitButler API of new release
        shell: bash
        env:
          CHANNEL: ${{ needs.build-tauri.outputs.channel }}
          VERSION: ${{ needs.publish-tauri.outputs.version }}-${{ github.run_number }}
          SHA: ${{ github.sha }}
          BOT_AUTH_TOKEN: ${{ secrets.BOT_AUTH_TOKEN }}
        run: |
          payload=$(jq -n \
            --arg channel "$CHANNEL" \
            --arg version "$VERSION" \
            --arg sha "$SHA" \
            '{channel: $channel, version: $version, sha: $sha}')
          curl 'https://app.gitbutler.com/api/releases' \
            --fail \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "X-Auth-Token: ${BOT_AUTH_TOKEN}" \
            --data "$payload"

  # The API re-scans S3 on every notify, so this second notify adds the Windows
  # build to the release whenever the Windows leg completes. Needing the first
  # notify serializes the two API calls and skips this one if it never happened.
  notify-gitbutler-api-windows:
    needs: [build-tauri, publish-windows, notify-gitbutler-api]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Notify GitButler API of the Windows build
        shell: bash
        env:
          CHANNEL: ${{ needs.build-tauri.outputs.channel }}
          VERSION: ${{ needs.publish-windows.outputs.version }}-${{ github.run_number }}
          SHA: ${{ github.sha }}
          BOT_AUTH_TOKEN: ${{ secrets.BOT_AUTH_TOKEN }}
        run: |
          payload=$(jq -n \
            --arg channel "$CHANNEL" \
            --arg version "$VERSION" \
            --arg sha "$SHA" \
            '{channel: $channel, version: $version, sha: $sha}')
          curl 'https://app.gitbutler.com/api/releases' \
            --fail \
            --retry 3 \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "X-Auth-Token: ${BOT_AUTH_TOKEN}" \
            --data "$payload"

  smoke-test-version-compatibility:
    needs: [notify-gitbutler-api, build-tauri, publish-tauri]
    uses: ./.github/workflows/smoke-test-version-compatibility.yaml
    with:
      channel: ${{ needs.build-tauri.outputs.channel }}
      expected_nightly_version: ${{ needs.publish-tauri.outputs.version }}

  create-git-tag:
    needs: [smoke-test-version-compatibility, build-tauri, publish-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push tags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create git tag
        shell: bash
        env:
          TAG_NAME: "${{ needs.build-tauri.outputs.channel }}/${{ needs.publish-tauri.outputs.version }}"
        run: |
          function tag_exists() {
            git tag --list | grep -q "^$1$"
          }
          function fetch_tag() {
            git fetch origin "refs/tags/$1:refs/tags/$1"
          }
          function delete_tag() {
            git push --delete origin "$1"
          }
          function create_tag() {
            git tag --force "$1"
            git push --tags
          }

          fetch_tag "$TAG_NAME" || true
          if tag_exists "$TAG_NAME"; then
            delete_tag "$TAG_NAME"
          fi
          create_tag "$TAG_NAME"
