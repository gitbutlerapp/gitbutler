name: "Test"
on:
  push:
    branches:
      - master
  pull_request:

env:
  RUST_BACKTRACE: full

concurrency:
  # A new push to a pull request supersedes its last run. Each master commit gets a group
  # of its own, so no master run is cancelled or dropped from the queue: they save the
  # caches pull requests restore, and show which merge broke master.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.filter.outputs.node }}
      rust: ${{ steps.filter.outputs.rust }}
      rust_core: ${{ steps.filter.outputs.rust_core }}
      ui: ${{ steps.filter.outputs.ui }}
      docs: ${{ steps.filter.outputs.docs }}
      but_installer: ${{ steps.filter.outputs.but_installer }}
      install_script: ${{ steps.filter.outputs.install_script }}
      tauri_gui: ${{ steps.filter.outputs.tauri_gui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workflows: &workflows
              - '.github/workflows/**'
              - '.github/actions/**'
            docs:
              - '**/*.md'
            node:
              - *workflows
              - 'apps/**'
              - 'packages/**'
              - 'e2e/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            ui:
              - 'packages/ui-svelte/**'
            common-rust: &rust
              - *workflows
              - 'Cargo.lock'
              - 'Cargo.toml'
            rust: &any-rust
              - *rust
              - 'crates/**'
            # Only gitbutler-tauri's `builtin-gpui` feature links the GPUI client, and only
            # test-rust-windows builds with it. A change to just the GPUI client or its
            # terminals (but-tty) can't affect any other crate, so jobs that never build it can
            # skip it.
            rust_core:
              - *rust
              - 'crates/!(but-gpui|but-tty)/**'
            but_installer:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/but-installer/**'
            install_script:
              - 'scripts/install.sh'
            # The Tauri app and what only it uses. quality.but.dev checks the rest (its spec is
            # specs/gitbutler.toml in gitbutlerapp/taste-tester), so the checks below run only
            # when one of these (or CI itself) changes.
            # Keep in sync with check-e2e-changes.yml.
            tauri_gui:
              - *workflows
              - 'apps/desktop/**'
              - 'crates/gitbutler-tauri/**'
              - 'packages/ui-svelte/**'
              - 'packages/shared/**'
              - 'packages/core/**'
              - 'e2e/**'

  prettier:
    needs: changes
    if: ${{ needs.changes.outputs.tauri_gui == 'true' && (needs.changes.outputs.node == 'true' || needs.changes.outputs.docs == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/init-env-node
      - run: pnpm prettier

  lint-node:
    needs: changes
    if: ${{ needs.changes.outputs.tauri_gui == 'true' && (needs.changes.outputs.node == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/init-env-node
      - run: pnpm lint

  check-node:
    needs: changes
    if: ${{ needs.changes.outputs.tauri_gui == 'true' && (needs.changes.outputs.node == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/init-env-node
      - run: pnpm check

  unittest-node:
    needs: changes
    if: ${{ needs.changes.outputs.tauri_gui == 'true' && (needs.changes.outputs.node == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/init-env-node
      - id: get_playwright_version
        shell: bash
        run: |
          version=$(pnpm --filter @gitbutler/ui-svelte --fail-if-no-match exec node -p 'require("playwright/package.json").version')
          echo "playwright-version=v$version" >> "$GITHUB_OUTPUT"
      - name: Cache playwright binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.get_playwright_version.outputs.playwright-version }}
      - run: pnpm ui:playwright:install:unit
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
      - run: pnpm test
        env:
          BUILDKITE_ANALYTICS_TOKEN: ${{ secrets.TEST_RESULTS_TOKEN_VITEST }}
          BUILDKITE_ANALYTICS_BASE_URL: https://tests.but.dev/v1/uploads
          # Normalized run identity, matching what the curl-based uploads send, so
          # every suite reports the same key/branch/sha for one CI run.
          BUILDKITE_ANALYTICS_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          BUILDKITE_ANALYTICS_BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILDKITE_ANALYTICS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  rust-lint:
    needs: changes
    if: ${{ needs.changes.outputs.tauri_gui == 'true' && (needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/gitbutlerapp/ci-base-image@sha256:3eaeae1b07072796a53dc1e7585cdc1f462d0b11d10ecd3685c6fa8082d647dd
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install Zig
        uses: $/.github/actions/setup-zig
      # quality.but.dev runs fmt and clippy for the rest of the workspace.
      - name: cargo clippy -p gitbutler-tauri
        run: |
          rustup component add clippy
          cargo clippy -p gitbutler-tauri --all-targets -- -D warnings
          cargo clippy -p gitbutler-tauri --all-targets --no-default-features -- -D warnings
          cargo clippy -p gitbutler-tauri --all-targets --all-features -- -D warnings

  rust-test-variants:
    needs: changes
    if: ${{ needs.changes.outputs.tauri_gui == 'true' && (needs.changes.outputs.rust_core == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # quality.but.dev runs this only on master, so pull requests still get it here. The
          # main test run and `make test-modern-but` are on quality.but.dev.
          - name: without nightly
            run: cargo nextest run --workspace --exclude gitbutler-tauri --exclude but-api-macros-tests --profile ci
    name: rust-test-variants (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      GITBUTLER_TESTS_NO_CLEANUP: "1"
      E2E_TEST_APP_DATA_DIR: /tmp/hermeticity-guard
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-test-no-tauri-${{ runner.os }}
          # The only job left using this cache, so it saves it now.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install Zig
        uses: $/.github/actions/setup-zig
      - name: Dependencies for 'keyring'
        run: sudo ./scripts/install-minimal-debian-dependencies.sh
      - name: Dependencies for the GPUI client
        run: sudo timeout 300 apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 libxcb1-dev libxkbcommon-x11-dev libfontconfig-dev
      - name: Install cargo-nextest
        run: |

          # To update the version of cargo-nextest, replace the version specifier in the `curl` command and update the
          # checksum.
          #
          # Checksums are available as artifacts on GitHub Release (https://github.com/nextest-rs/nextest/releases),
          # should be called "cargo-nextest-<VERSION>-x86_64-unknown-linux-gnu.sha256"
          curl -LsSf https://get.nexte.st/0.9.143/linux -o cargo-nextest.tar.gz
          echo "66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e  cargo-nextest.tar.gz" | sha256sum -c -
          tar -xzf cargo-nextest.tar.gz -C ${CARGO_HOME:-~/.cargo}/bin
          rm cargo-nextest.tar.gz
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
      - name: Assert test hermeticity
        run: |
          if [ -e "$E2E_TEST_APP_DATA_DIR" ]; then
            echo "::error::Tests wrote to the user-level app-data dir. Use Context::from_repo_for_testing or but_testsupport::isolated_app_data_dir instead of settings-loading constructors:"
            find "$E2E_TEST_APP_DATA_DIR"
            exit 1
          fi

  rust-test-tauri:
    needs: changes
    if: ${{ needs.changes.outputs.tauri_gui == 'true' && (needs.changes.outputs.rust_core == 'true') }}
    runs-on: ubuntu-latest
    # A build with no cache must finish within this limit. A job that times out saves no cache,
    # so the next run also starts with no cache.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/gitbutlerapp/ci-base-image@sha256:3eaeae1b07072796a53dc1e7585cdc1f462d0b11d10ecd3685c6fa8082d647dd
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-test-tauri
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # quality.but.dev tests but-api-macros without features and with `legacy`.
      - name: Test but-api-macros --features tauri
        run: cargo test -p but-api-macros-tests --features tauri
      - run: |
          set -e
          cargo check -p gitbutler-tauri --no-default-features
          for feature in devtools custom-protocol error-context packaged-but-distribution builtin-but; do
            cargo check -p gitbutler-tauri --no-default-features --features "$feature"
          done
        name: Test Tauri and Check Tauri App Features

  check-rust-windows:
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 25
    if: ${{ needs.changes.outputs.tauri_gui == 'true' && (needs.changes.outputs.rust == 'true') }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-check-windows
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install Zig
        uses: $/.github/actions/setup-zig
      - name: "cargo check"
        run: cargo check --workspace --all-targets --features windows
      # The GPUI client's Windows code: the lint job runs on Linux, which builds it as a stub.
      - name: "cargo clippy -p but-gpui -p but-tty"
        run: cargo clippy -p but-gpui -p but-tty --all-targets -- -D warnings

  # Separate from check-rust-windows and build-tauri-windows so the three run side by side:
  # each builds different code, so they share little of their work or their cache.
  test-rust-windows:
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 35
    if: ${{ needs.changes.outputs.tauri_gui == 'true' && (needs.changes.outputs.rust == 'true') }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-test
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install Zig
        uses: $/.github/actions/setup-zig
      - name: "cargo test -p but-gpui -p but-tty"
        run: cargo test -p but-gpui -p but-tty

  build-tauri-windows:
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 25
    if: ${{ needs.changes.outputs.tauri_gui == 'true' && (needs.changes.outputs.rust == 'true') }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-build-tauri-windows
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install Zig
        uses: $/.github/actions/setup-zig
      # The desktop app with the native client, as Windows builds ship it: GPUI's and Tauri's
      # resources only clash when the executable links.
      - name: "cargo build -p gitbutler-tauri --features windows,builtin-gpui"
        run: cargo build -p gitbutler-tauri --features windows,builtin-gpui

  build-installer:
    needs: changes
    if: ${{ needs.changes.outputs.but_installer == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15 # [macOs, ARM64] - default target
            artifact_id: macos-15-aarch64
            target: ""
          - platform: macos-15 # [macOs, x64] - cross-compile
            artifact_id: macos-15-x86_64
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04 # [linux, x64]
            artifact_id: linux-x86_64
            target: ""
          - platform: ubuntu-22.04-arm # [linux, ARM64]
            artifact_id: linux-aarch64
            target: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20

    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set Cargo build target to ${{ matrix.target }}
        shell: bash
        if: matrix.target != ''
        run: |
          echo "CARGO_BUILD_TARGET=${{ matrix.target }}" >> $GITHUB_ENV
          rustup target add ${{ matrix.target }}
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: installer
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build installer for x86_64
        run: cargo build --release -p but-installer
      - name: Verify binaries
        run: |
          test -x target/${{matrix.target}}/release/but-installer
          file target/${{matrix.target}}/release/but-installer
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "but-installer-${{ matrix.artifact_id }}-${{ github.run_number }}"
          path: target/${{matrix.target}}/release/but-installer
          if-no-files-found: error
          retention-days: 7

  fetch-published-versions:
    needs: changes
    if: ${{ needs.changes.outputs.install_script == 'true' || needs.changes.outputs.but_installer == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      release_version: ${{ steps.fetch.outputs.release_version }}
      nightly_version: ${{ steps.fetch.outputs.nightly_version }}
    steps:
      - name: Fetch latest release and nightly versions
        id: fetch
        run: |
          echo "release_version=$(curl -s https://app.gitbutler.com/releases | jq -r .version)" >> $GITHUB_OUTPUT
          echo "nightly_version=$(curl -s https://app.gitbutler.com/releases/nightly | jq -r .version)" >> $GITHUB_OUTPUT

  validate-install-script:
    needs:
      - changes
      - fetch-published-versions
    if: ${{ needs.changes.outputs.install_script == 'true' }}
    permissions:
      contents: read
    env:
      LATEST_RELEASE_VERSION: ${{ needs.fetch-published-versions.outputs.release_version }}
      LATEST_NIGHTLY_VERSION: ${{ needs.fetch-published-versions.outputs.nightly_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15 # [macOs, ARM64] - default target
          - platform: ubuntu-22.04 # [linux, x64]
          - platform: ubuntu-22.04-arm # [linux, ARM64]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install release
        run: ./scripts/install.sh
      - name: Validate release version
        run: but --version | grep "but $LATEST_RELEASE_VERSION"
      - name: Install nightly
        run: ./scripts/install.sh nightly
      - name: Validate nightly version
        run: but --version | grep "but $LATEST_NIGHTLY_VERSION"

  validate-installer:
    needs:
      - build-installer
      - fetch-published-versions
    permissions:
      contents: none
    env:
      LATEST_RELEASE_VERSION: ${{ needs.fetch-published-versions.outputs.release_version }}
      LATEST_NIGHTLY_VERSION: ${{ needs.fetch-published-versions.outputs.nightly_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15 # [macOs, ARM64] - default target
            artifact_id: macos-15-aarch64
          - platform: macos-15 # [macOs, x64] - cross-compile
            artifact_id: macos-15-x86_64
          - platform: ubuntu-22.04 # [linux, x64]
            artifact_id: linux-x86_64
          - platform: ubuntu-22.04-arm # [linux, ARM64]
            artifact_id: linux-aarch64
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    steps:
      - name: Download ${{ matrix.artifact_id }} installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "but-installer-${{ matrix.artifact_id }}-${{ github.run_number }}"
          path: .
      - run: chmod +x ./but-installer
      - name: Install release
        run: ./but-installer
      - name: Validate release version
        run: but --version | grep "but $LATEST_RELEASE_VERSION"
      - name: Install nightly
        run: ./but-installer nightly
      - name: Validate nightly version
        run: but --version | grep "but $LATEST_NIGHTLY_VERSION"

  publish-installer:
    needs: build-installer
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download macOS x86_64 installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "but-installer-macos-15-x86_64-${{ github.run_number }}"
          path: s3-upload/macos/x86_64
      - name: Download macOS aarch64 installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "but-installer-macos-15-aarch64-${{ github.run_number }}"
          path: s3-upload/macos/aarch64
      - name: Download Linux x86_64 installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "but-installer-linux-x86_64-${{ github.run_number }}"
          path: s3-upload/linux/x86_64
      - name: Download Linux aarch64 installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "but-installer-linux-aarch64-${{ github.run_number }}"
          path: s3-upload/linux/aarch64
      - name: Make binaries executable
        run: |
          find ./s3-upload -name 'but-installer' | xargs chmod +x
      - name: Upload to S3
        uses: shallwefootball/s3-upload-action@4350529f410221787ccf424e50133cbc1b52704e # master
        with:
          aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_bucket: "releases.gitbutler.com"
          source_dir: "s3-upload/"
          destination_dir: "installers/${{ github.sha }}"
      # Master runs overlap, so one that finishes after a newer installer change landed must
      # leave installers/latest to that change's run. The paths are the but_installer filter's.
      - name: Check no newer installer change is on master
        id: tip
        env:
          SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin master
          if git diff --quiet "$SHA" FETCH_HEAD -- Cargo.lock Cargo.toml crates/but-installer; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to S3 (latest)
        if: steps.tip.outputs.latest == 'true'
        uses: shallwefootball/s3-upload-action@4350529f410221787ccf424e50133cbc1b52704e # master
        with:
          aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_bucket: "releases.gitbutler.com"
          source_dir: "s3-upload/"
          destination_dir: "installers/latest"

  check-rust:
    # Skip the aggregator when the run itself is cancelled: a concurrency-
    # cancelled twin run has `cancelled` needs, which alls-green scores as
    # failure — a phantom red required check on the same commit as the live
    # (green) run.
    if: ${{ !cancelled() }}
    needs:
      - changes
      - check-rust-windows
      - test-rust-windows
      - build-tauri-windows
      - rust-test-variants
      - rust-test-tauri
      - rust-lint
      - build-installer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          allowed-skips: ${{ toJSON(needs) }}
          jobs: ${{ toJSON(needs) }}

  # Check that all `actions/checkout` in CI jobs have `persist-credentials: false`.
  check-no-persist-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GLOB: .github/workflows/*.@(yaml|yml)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ".github/workflows"
      - name: Generate workflows list to scan
        run: |
          shopt -s extglob
          printf '%s\n' ${{ env.GLOB }} | grep -v .github/workflows/publish.yaml >workflows.list
          cat workflows.list
          echo "Note that publish.yaml is excluded until it's ensured to not need this feature"
      - name: Scan workflows
        run: |
          shopt -s extglob
          yq '.jobs.*.steps[]
            | select(.uses == "actions/checkout@*" and .with.["persist-credentials"]? != false)
            | {"file": filename, "line": line, "name": (.name // .uses)}
            | .file + ":" + (.line | tostring) + ": " + .name
          ' -- $(cat workflows.list) >query-output.txt
          cat query-output.txt
          test -z "$(<query-output.txt)"  # Report failure if we found anything
  test-ui:
    needs: changes
    if: ${{ needs.changes.outputs.tauri_gui == 'true' && (needs.changes.outputs.ui == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/gitbutlerapp/ci-base-image@sha256:3eaeae1b07072796a53dc1e7585cdc1f462d0b11d10ecd3685c6fa8082d647dd
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/init-env-node
      - id: get_playwright_version
        shell: bash
        run: |
          version=$(pnpm --filter @gitbutler/ui-svelte --fail-if-no-match exec node -p 'require("playwright/package.json").version')
          echo "playwright-version=v$version" >> "$GITHUB_OUTPUT"
      - name: cache playwright binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-with-webkit-${{ steps.get_playwright_version.outputs.playwright-version }}
      - run: pnpm ui:playwright:install:ct
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
      - name: run playwright tests
        run: pnpm test:ct
        env:
          BUILDKITE_ANALYTICS_TOKEN: ${{ secrets.TEST_RESULTS_TOKEN_PLAYWRIGHT_CT }}
          BUILDKITE_ANALYTICS_BASE_URL: https://tests.but.dev/v1/uploads
          # Normalized run identity, matching what the curl-based uploads send, so
          # every suite reports the same key/branch/sha for one CI run.
          BUILDKITE_ANALYTICS_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          BUILDKITE_ANALYTICS_BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILDKITE_ANALYTICS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            ./packages/ui-svelte/playwright-report/
            ./packages/ui-svelte/test-results/
          retention-days: 30
