# What ci.but.dev runs for each GitButler pull request: which checks, on which
# platforms, and which changes call for them.
#
# ci.but.dev reads this file from the commit under test, so a PR that changes what CI
# should run changes it here, in the same PR.
#
# Scope: the `but` CLI, the GPUI client and the crates under them, plus the TypeScript
# packages that aren't Svelte (but-sdk, but-mcp-app, ui-react, the lint plugins).
# The Svelte/Tauri app is not tested: apps/desktop, apps/web, packages/ui-svelte,
# packages/shared, packages/core, crates/gitbutler-tauri, and the e2e suites that drive
# them.
#
# Every task runs with bash `set -euo pipefail` in its own warm worktree (its "lane").
# Tasks get these environment variables:
#   TASTE_PLATFORM             linux | macos | windows
#   TASTE_EVENT                pr | push (pushes to master run everything)
#   TASTE_CHANGED_<GROUP>      true | false for each group in [paths]
#   TASTE_CARGO_PACKAGES       cargo args for the affected crates: `-p a -p b`, or
#                              `--workspace --exclude …` when everything is affected
#   TASTE_CARGO_LIB_PACKAGES   the same, limited to crates with a library (for --doc)
#   TASTE_CARGO_PACKAGE_NAMES  the affected crates' names, space-separated
#
# Conditions: `when` (path groups; any matched), `events` ("pr", "push"; both by
# default) and, for Rust, `affected-crates` (some crate is affected) and `when-crates`
# (one of these crates is affected).
#
# `priority = "low"` runs a task under `nice`, so on a shared runner the tests (the
# critical path) get the CPU first. TASTE_CARGO_LIB_DIRS lists `name=dir` for the
# affected crates that have a library.
#
# See what a branch would run:  taste-tester plan [--base origin/master]
# (taste-tester: https://ci.but.dev)

# ---------------------------------------------------------------------------------
# Path groups. Globs are anchored at the repository root; `@group` includes another.

[paths]
# Changes that can affect every crate.
rust-global = [
    "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**",
    ".config/nextest.toml", "deny.toml", "rustfmt.toml", "Makefile",
]
rust = { include = ["crates/**", "@rust-global"], exclude = ["crates/gitbutler-tauri/**"] }

node-global = [
    "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "turbo.json",
    "eslint.config.js", ".prettierrc*", ".prettierignore", "tsconfig*.json",
]
node = [
    "packages/but-sdk/**", "packages/but-mcp-app/**", "packages/ui-react/**",
    "packages/no-cross-domain-imports/**", "packages/no-relative-imports/**",
    "@node-global",
]
ui-react = ["packages/ui-react/**", "@node-global"]
# The SDK's types are generated from the Rust API.
but-sdk = { include = ["packages/but-sdk/**", "crates/**", "@rust-global", "@node-global"], exclude = [
    "crates/but-gpui/**", "crates/but-tty/**", "crates/gitbutler-tauri/**",
] }
docs = ["**/*.md"]

[cargo]
# gitbutler-tauri is the Tauri app; but-api-macros-tests is tested on its own below.
exclude = ["gitbutler-tauri", "but-api-macros-tests"]
# A change to these affects every crate.
everything-when = ["@rust-global"]

# ---------------------------------------------------------------------------------
# Rust: tests, only for the crates the change affects (and everything that depends on
# them). Pushes to master and changes to Cargo.lock etc. test the whole workspace.
#
# Tasks start in the order they appear here when a runner limits how many run at once,
# so the longest ones come first.

# `--retries 1`: a test that fails and then passes counts as passed and is reported as
# flaky (in the log and on the job page), so flakes stay visible without failing the check.
[[task]]
name = "test"
platforms = ["linux", "macos"]
affected-crates = true
timeout = "20m"
env = { GITBUTLER_TESTS_NO_CLEANUP = "1", NEXTEST_FILTER = "all()" }
run = """
# Tests leave fixtures behind (GITBUTLER_TESTS_NO_CLEANUP); give each run a fresh temp
# dir and delete the previous one in the background instead of waiting for it.
# Fully resolved (no `..`, no symlinks): tests compare canonical paths against it.
export TMPDIR="$(cd .. && pwd -P)/tmp-$(basename "$PWD")"
if [ -d "$TMPDIR" ]; then mv "$TMPDIR" "$TMPDIR.old.$$"; (rm -rf "$TMPDIR.old.$$" &); fi
mkdir -p "$TMPDIR"
# On macOS, debug info stays in each crate's .o files next to the binaries, and every
# commit adds a new set: 220k files in a day. Anything linking curl lists that whole
# directory at startup (Curl_macos_init → CFBundleGetMainBundle), which cost every `but`
# test over a second. Linking doesn't use them; the old ones only hold line numbers for
# binaries that have since been rebuilt.
if [ "$TASTE_PLATFORM" = macos ]; then
  find target/debug/deps -maxdepth 1 -name '*.o' -delete 2>/dev/null || true
fi
# Any test that loads user-level settings writes here; the end asserts nothing did.
export E2E_TEST_APP_DATA_DIR="$TMPDIR/hermeticity-guard"

# Build the whole workspace, with the same features, every time, and run only the
# affected crates' tests. With `-p a -p b`, Cargo unifies features across just those
# packages, so each selection built its own copy of the shared crates: 12 copies of
# some, 171 GB in this lane on Linux, and a rebuild whenever the selection changed.
# Unaffected crates are already built, so the build is still the affected crates.
case "$TASTE_CARGO_PACKAGES" in
  *--workspace*) packages="all()" ;;
  *) packages=$(printf 'package(=%s) | ' $TASTE_CARGO_PACKAGE_NAMES); packages="${packages% | }" ;;
esac
cargo nextest run --workspace --exclude gitbutler-tauri --exclude but-api-macros-tests \
  --features but/nightly --profile ci --retries 1 -E "($NEXTEST_FILTER) & ($packages)"

if [ -e "$E2E_TEST_APP_DATA_DIR" ]; then
  echo "Tests wrote to the user-level app-data dir. Use Context::from_repo_for_testing or but_testsupport::isolated_app_data_dir instead of settings-loading constructors:"
  find "$E2E_TEST_APP_DATA_DIR"
  exit 1
fi
"""
[task.platform.macos]
# These fail on macOS for unclear reasons; keep running them locally.
env = { NEXTEST_FILTER = "not (test(=tests::reconciliation_reuses_filter_process) | test(=tests::core_hunks_reuse_filter_process) | test(=tests::assign_reuses_filter_process) | test(=tests::reused_filter_recovers_after_file_failure) | test(=locked_index_rejects_enter_edit_mode_without_changes) | test(=locked_symlinked_index_rejects_enter_edit_mode_without_changes))" }

# Doctests run beside `test`, not after it. Few crates have any (25 doctests in 4
# crates), so on pull requests only affected crates whose docs contain code blocks are
# compiled for them; pushes to master run every crate's doctests.
[[task]]
name = "doctest"
platforms = ["linux", "macos"]
affected-crates = true
timeout = "20m"
run = '''
# Whether a crate has doctests rustdoc would compile: a code fence in its doc comments,
# or in Markdown pulled in with #[doc = include_str!(...)], that is untagged or tagged
# rust/no_run/should_panic/compile_fail/editionNNNN, and not ignore. awk reads the files
# itself and prints "yes": no pipes, which under pipefail turned an early "found" into
# "not found" whenever the writer was still writing (seen on a busy Mac).
fences='
  FNR == 1 { inb = 0 }
  { line = $0
    if (!md) { if (line !~ /^[[:space:]]*\/\/[\/!]/) next; sub(/^[[:space:]]*\/\/[\/!][[:space:]]?/, "", line) }
    if (line ~ /^[[:space:]]*```/) {
      if (!inb) {
        lang = line; sub(/^[[:space:]]*```+/, "", lang); gsub(/[[:space:]]/, "", lang)
        if (lang !~ /ignore/ && (lang == "" || lang ~ /^(rust|no_run|should_panic|compile_fail|edition[0-9]+)(,|$)/)) { print "yes"; exit }
        inb = 1
      } else inb = 0
    } }'
has_doctests() {
  [ -n "$(find "$1/src" -name '*.rs' -exec awk -v md=0 "$fences" {} + 2>/dev/null)" ] && return 0
  local inc
  for inc in $(grep -rEo 'doc[[:space:]]*=[[:space:]]*include_str!\("[^"]+"\)' "$1/src" 2>/dev/null \
      | sed -E 's/^([^:]+):.*include_str!\("([^"]+)"\)$/\1|\2/'); do
    [ -n "$(awk -v md=1 "$fences" "$(dirname "${inc%%|*}")/${inc#*|}" 2>/dev/null)" ] && return 0
  done
  return 1
}

if [ "$TASTE_EVENT" = push ]; then
  pkgs="$TASTE_CARGO_LIB_PACKAGES"
else
  pkgs=""
  for entry in $TASTE_CARGO_LIB_DIRS; do
    if has_doctests "${entry#*=}"; then pkgs="$pkgs -p ${entry%%=*}"; fi
  done
fi
if [ -z "$pkgs" ]; then echo "none of the affected crates has doctests"; exit 0; fi
# `but/nightly` only when `but` itself is among them; cargo rejects it otherwise.
features=""
case " $pkgs " in
  *" -p but "*) features="--features but/nightly" ;;
  *--workspace*) case " $TASTE_CARGO_PACKAGE_NAMES " in *" but "*) features="--features but/nightly" ;; esac ;;
esac
echo "doctests for:$pkgs"
cargo test --doc $pkgs $features
'''

# The `nightly` feature only changes `but` and what depends on it, so without it only
# those need testing again. On pushes to master only (see `events`).
[[task]]
name = "test-without-nightly"
platforms = ["linux"]
# It reruns ~2,000 `but` tests beside `test` on the same box, the costliest part of a
# PR's test load, to check a feature that changes little: master catches it.
events = ["push"]
affected-crates = true
when-crates = ["but"]
timeout = "20m"
run = """
export E2E_TEST_APP_DATA_DIR="$(mktemp -d)/hermeticity-guard"
cargo nextest run $TASTE_CARGO_PACKAGES --profile ci --retries 1 -E 'rdeps(but)'
test ! -e "$E2E_TEST_APP_DATA_DIR" || { echo "Tests wrote to the user-level app-data dir:"; find "$E2E_TEST_APP_DATA_DIR"; exit 1; }
"""

# `but` without any legacy code.
[[task]]
name = "test-modern-but"
platforms = ["linux"]
affected-crates = true
when-crates = ["but", "gitbutler-filemonitor"]
timeout = "20m"
run = """
export E2E_TEST_APP_DATA_DIR="$(mktemp -d)/hermeticity-guard"
names=" $TASTE_CARGO_PACKAGE_NAMES "
case "$names" in *" but "*) make test-modern-but ;; *) echo "but is not affected" ;; esac
case "$names" in
  *" gitbutler-filemonitor "*) (cd crates/gitbutler-filemonitor/vendor/debouncer && cargo test) ;;
esac
test ! -e "$E2E_TEST_APP_DATA_DIR" || { echo "Tests wrote to the user-level app-data dir:"; find "$E2E_TEST_APP_DATA_DIR"; exit 1; }
"""

# Compile-time coverage of the `#[but_api]` macros against but-api and everything
# under it, so it runs whenever any of that changes.
[[task]]
name = "api-macros"
priority = "low"
platforms = ["linux"]
when-crates = ["but-api-macros-tests"]
run = """
cargo test -p but-api-macros-tests
cargo test -p but-api-macros-tests --features legacy
"""

# ---------------------------------------------------------------------------------
# Rust: formatting and dependency hygiene (no build, so they share one lane).

[[task]]
name = "fmt"
priority = "low"
lane = "quick"
platforms = ["linux"]
when = ["rust"]
timeout = "5m"
run = "cargo fmt --check --all"

[[task]]
name = "machete"
priority = "low"
lane = "quick"
platforms = ["linux"]
when = ["rust"]
timeout = "5m"
run = "cargo machete"

[[task]]
name = "deny"
priority = "low"
lane = "quick"
platforms = ["linux"]
when = ["rust"]
timeout = "5m"
run = "cargo deny check bans licenses sources"

# ---------------------------------------------------------------------------------
# Rust: lints. Workspace-wide (lints are cheap to keep warm and catch API breakage in
# dependents); one lane per feature set so each keeps its own cache.

[[task]]
name = "clippy"
priority = "low"
platforms = ["linux"]
when = ["rust"]
run = "cargo clippy --workspace --exclude gitbutler-tauri --all-targets -- -D warnings"

[[task]]
name = "clippy-no-default-features"
priority = "low"
platforms = ["linux"]
when = ["rust"]
run = "cargo clippy --workspace --exclude gitbutler-tauri --all-targets --no-default-features -- -D warnings"

[[task]]
name = "clippy-all-features"
priority = "low"
platforms = ["linux"]
when = ["rust"]
run = """
# Every feature except the Tauri ones (`--all-features` would build Tauri through
# but-api's `tauri` feature).
features=$(cargo metadata --no-deps --format-version 1 --offline | jq -r '
  [.packages[] | select(.name != "gitbutler-tauri") | .name as $p
   | .features | keys[] | select(test("tauri") | not) | "\\($p)/\\(.)"] | join(",")')
cargo clippy --workspace --exclude gitbutler-tauri --all-targets --features "$features" -- -D warnings
"""

[[task]]
name = "check-features"
priority = "low"
platforms = ["linux"]
when = ["rust"]
env = { RUSTFLAGS = "--deny warnings" }
run = """
cargo check -p but-testsupport --all-targets
cargo check -p but-testsupport --all-targets --features sandbox
cargo check -p but-testsupport --all-targets --features sandbox-but-api
cargo check -p but-ctx --all-targets
cargo check -p but-serde --all-targets
cargo check -p but-meta --all-targets
cargo check -p but-graph --all-targets
cargo check -p but-workspace --all-targets
cargo check -p but-api --all-targets
cargo check -p but --all-targets
cargo check -p but-api --all-targets --features graph-workspace
cargo check -p but --all-targets --features graph-workspace
make check-modern-but
"""

[[task]]
name = "doc"
priority = "low"
platforms = ["linux"]
when = ["rust"]
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps --exclude gitbutler-tauri --exclude but-api-macros-tests --features but/nightly"

# ---------------------------------------------------------------------------------
# Windows (runs once ci.but.dev has a Windows runner). The full test suite doesn't run
# on Windows yet; the GPUI client and its terminals do, and everything must compile.

[[task]]
name = "windows-check"
platforms = ["windows"]
when = ["rust"]
timeout = "25m"
run = "cargo check --workspace --exclude gitbutler-tauri --all-targets"

[[task]]
name = "gpui-clippy"
platforms = ["windows"]
affected-crates = true
when-crates = ["but-gpui", "but-tty"]
run = "cargo clippy -p but-gpui -p but-tty --all-targets -- -D warnings"

[[task]]
name = "gpui-test"
platforms = ["windows"]
affected-crates = true
when-crates = ["but-gpui", "but-tty"]
timeout = "25m"
# nextest, not `cargo test`: libtest runs but-gpui's 446 tests as threads of one process,
# which took a constant 108s on Windows; a process per test takes 22s (2026-11-04).
run = "cargo nextest run -p but-gpui -p but-tty --profile ci --retries 1"

# ---------------------------------------------------------------------------------
# TypeScript (the non-Svelte packages). `pnpm install` is quick with a warm store.

[[task]]
name = "prettier"
priority = "low"
platforms = ["linux"]
when = ["node", "docs"]
timeout = "10m"
run = """
pnpm install --frozen-lockfile --prefer-offline
pnpm exec prettier --check \\
  packages/but-sdk packages/but-mcp-app packages/ui-react \\
  packages/no-cross-domain-imports packages/no-relative-imports \\
  '**/*.md' '!apps/**' '!packages/ui-svelte/**' '!packages/shared/**' '!packages/core/**' '!e2e/**'
"""

[[task]]
name = "node-lint"
priority = "low"
platforms = ["linux"]
when = ["node"]
timeout = "10m"
run = """
pnpm install --frozen-lockfile --prefer-offline
# The repo's lint rules come from these two plugins, which must be built first.
pnpm turbo run package --filter @gitbutler/no-relative-imports --filter @gitbutler/no-cross-domain-imports
# The repo's ESLint config ignores some of these (but-sdk); that's not an error here.
pnpm exec eslint --no-error-on-unmatched-pattern packages/but-sdk packages/but-mcp-app packages/ui-react \\
  packages/no-cross-domain-imports packages/no-relative-imports
"""

[[task]]
name = "node-check"
priority = "low"
platforms = ["linux"]
when = ["node"]
timeout = "10m"
run = """
pnpm install --frozen-lockfile --prefer-offline
pnpm turbo run check --filter @gitbutler/but-sdk --filter @gitbutler/but-mcp-app \\
  --filter @gitbutler/ui-react --filter @gitbutler/no-cross-domain-imports
"""

[[task]]
name = "node-test"
priority = "low"
platforms = ["linux"]
when = ["node"]
timeout = "10m"
run = """
pnpm install --frozen-lockfile --prefer-offline
pnpm --filter @gitbutler/no-cross-domain-imports --filter @gitbutler/no-relative-imports \\
  --filter @gitbutler/ui-react exec vitest run
"""

# Storybook story tests drive Chromium through Playwright, whose pinned version can't
# install browsers on the Linux runner's Ubuntu 26.04; macOS is supported.
[[task]]
name = "ui-react-stories"
platforms = ["macos"]
when = ["ui-react"]
timeout = "15m"
run = """
pnpm install --frozen-lockfile --prefer-offline
pnpm --filter @gitbutler/ui-react exec playwright install chromium
pnpm --filter @gitbutler/ui-react test:stories
"""

[[task]]
name = "but-sdk"
priority = "low"
platforms = ["linux"]
when = ["but-sdk"]
run = """
pnpm install --frozen-lockfile --prefer-offline
pnpm --filter @gitbutler/but-sdk build
./scripts/generate-sdk-types.sh
pnpm --filter @gitbutler/but-sdk check
"""
