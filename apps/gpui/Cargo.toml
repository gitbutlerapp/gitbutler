[package]
name = "gitbutler-gpui"
version = "0.0.0"
edition = "2024"
publish = false
description = "An experimental native GitButler client built on GPUI"
license-file = "../../LICENSE.md"

# A workspace of its own: GPUI's dependency tree and toolchain stay out of the main
# Cargo.lock and CI, and deleting this directory removes the app entirely.
[workspace]

[[bin]]
name = "gitbutler-gpui"
path = "src/main.rs"

[features]
## Scripted input and frame screenshots for development, see `src/dev.rs`.
dev-script = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "28d0a3547f16b9609b301b48ab363bfca649c864" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "28d0a3547f16b9609b301b48ab363bfca649c864", features = ["font-kit"] }
anyhow = "1.0.100"
futures = "0.3.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.148"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
image = { version = "0.25.1", default-features = false, features = ["png"], optional = true }
# Word-level emphasis and tree-sitter scope breadcrumbs for diffs.
deltoids = { git = "https://github.com/juanibiapina/deltoids", rev = "617f331ef13e80ddc476239cb392763fa6567e41" }

# GitButler, consumed only from `src/backend`.
but-api = { path = "../../crates/but-api", features = ["legacy"] }
but-askpass = { path = "../../crates/but-askpass" }
but-core = { path = "../../crates/but-core" }
but-forge = { path = "../../crates/but-forge" }
but-ctx = { path = "../../crates/but-ctx", features = ["legacy"] }
but-path = { path = "../../crates/but-path" }
but-rebase = { path = "../../crates/but-rebase" }
but-settings = { path = "../../crates/but-settings" }
but-workspace = { path = "../../crates/but-workspace", features = ["legacy"] }
gitbutler-project = { path = "../../crates/gitbutler-project" }
gitbutler-watcher = { path = "../../crates/gitbutler-watcher" }
bstr = "1.12.1"
gix = { git = "https://github.com/GitoxideLabs/gitoxide", rev = "79f388066484c445c038823b2201220e34b0b312", default-features = false, features = ["sha1"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread"] }

[patch.crates-io]
# Mirrors the main workspace so the GitButler crates resolve exactly as they do there.
gix = { git = "https://github.com/GitoxideLabs/gitoxide", rev = "79f388066484c445c038823b2201220e34b0b312" }
git2 = { git = "https://github.com/gitbutlerapp/git2-rs", rev = "a87a7bb3f6843504339fe7434ee0732a3e968f3e" }
# Mirrors Zed: GPUI relies on these forks.
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package]
gpui_macros = { opt-level = 3 }
taffy = { opt-level = 3 }
gix = { opt-level = 3 }
gix-diff = { opt-level = 3 }
gix-imara-diff = { opt-level = 3 }
gix-index = { opt-level = 3 }
gix-odb = { opt-level = 3 }
gix-pack = { opt-level = 3 }
gix-object = { opt-level = 3 }
gix-ref = { opt-level = 3 }
gix-hash = { opt-level = 3 }
gix-merge = { opt-level = 3, debug-assertions = false }
but-graph = { opt-level = 3 }
sha1dc = { opt-level = 3 }
zlib-rs = { opt-level = 3 }
syntect = { opt-level = 3 }
fancy-regex = { opt-level = 3 }
regex-automata = { opt-level = 3 }
