<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>GitButler Lite</title>
		<style>
			:root {
				--startup-logo-base: rgb(37 177 177 / 55%);
				--startup-logo-shimmer: rgb(255 255 255 / 85%);
				--startup-logo-mask: url("data:image/svg+xml,%3Csvg width='104' height='104' viewBox='0 0 104 104' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M22.88 83.2V20.8L51.9543 48.1236L81.12 20.8V83.2L51.9543 55.9709L22.88 83.2Z' fill='black'/%3E%3C/svg%3E");
			}

			html,
			body,
			#root {
				width: 100%;
				height: 100%;
				margin: 0;
				background: transparent;

				/* As per Base UI's recommended setup. */
				isolation: isolate;
			}

			.startup-loader {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 100%;
				height: 100%;
				app-region: drag;
			}

			.startup-loader__logo {
				position: relative;
				width: 64px;
				height: 64px;
				animation: startup-logo-fade-in 180ms ease-out 60ms forwards;
				opacity: 0;
			}

			.startup-loader__logo svg,
			.startup-loader__shimmer {
				position: absolute;
				width: 100%;
				height: 100%;
				inset: 0;
			}

			.startup-loader__logo svg {
				color: var(--startup-logo-base);
			}

			.startup-loader__shimmer {
				background: linear-gradient(
					112deg,
					transparent 25%,
					var(--startup-logo-shimmer) 50%,
					transparent 75%
				);
				background-position: 140% 0;
				background-size: 220% 100%;
				background-repeat: no-repeat;
				animation: startup-logo-shimmer 2200ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
				-webkit-mask: var(--startup-logo-mask) center / contain no-repeat;
				mask: var(--startup-logo-mask) center / contain no-repeat;
			}

			@media (prefers-reduced-motion: reduce) {
				.startup-loader__logo {
					animation: none;
					opacity: 1;
				}

				.startup-loader__shimmer {
					animation: none;
				}
			}

			@keyframes startup-logo-fade-in {
				to {
					opacity: 1;
				}
			}

			@keyframes startup-logo-shimmer {
				to {
					background-position: -105% 0;
				}
			}
		</style>
	</head>
	<body>
		<div id="root">
			<div class="startup-loader" aria-hidden="true">
				<div class="startup-loader__logo">
					<svg viewBox="0 0 104 104" aria-hidden="true">
						<path
							d="M22.88 83.2V20.8L51.9543 48.1236L81.12 20.8V83.2L51.9543 55.9709L22.88 83.2Z"
							fill="currentColor"
						/>
					</svg>
					<div class="startup-loader__shimmer"></div>
				</div>
			</div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
