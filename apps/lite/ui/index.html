<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>GitButler Lite</title>
		<style>
			:root {
				/* Visible once the renderer loads but before React is ready. Keep in sync with --bg-1. */
				background: light-dark(#ffffff, #292929);
				color-scheme: light dark;
			}

			#root {
				height: 100dvh;
				overflow: hidden;
				/* As per Base UI's recommended setup. */
				isolation: isolate;
			}
		</style>
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
