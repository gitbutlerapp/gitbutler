[package]
name = "but-gpui"
version = "0.0.0"
edition.workspace = true
repository.workspace = true
authors.workspace = true
license-file = "../../LICENSE.md"
description = "An experimental native GitButler client built on GPUI"
publish = false
# GPUI follows Zed's toolchain.
rust-version = "1.98"

[[bin]]
name = "gitbutler-gpui"
path = "src/main.rs"

[lints]
workspace = true

[features]
## Scripted input and frame screenshots for development, see `src/dev.rs`.
dev-script = ["gpui/test-support", "gpui_platform/test-support"]

# Only macOS builds the client for now: elsewhere GPUI needs system libraries the
# workspace's Linux and Windows CI don't install, so those get a stub `main`.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "28d0a3547f16b9609b301b48ab363bfca649c864" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "28d0a3547f16b9609b301b48ab363bfca649c864", features = ["font-kit"] }
# Only the parsing and the dumps two-face embeds: no YAML or plist loading.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
# bat's syntaxes on top of syntect's, for TypeScript, Svelte, TOML and the like, as the CLI's.
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
# Decodes a diff's images, shrunk to the size they're shown at.
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# Text drawn as the web apps draw it and the Dock icon (see `run`), scripted runs kept out of
# App Nap, and the cursor shown again when the window becomes key.
objc2 = "0.6.4"
raw-window-handle = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSObject", "NSProcessInfo", "NSString", "NSUserDefaults", "NSValue"] }
# Word-level emphasis and tree-sitter scope breadcrumbs for diffs. GitButler's fork, whose
# features leave out bat (an LGPL dependency and a second syntax set) and the grammars that
# cost the most for the least: Kotlin, C++, SQL, Ruby and Bash diffs go without breadcrumbs.
deltoids = { git = "https://github.com/gitbutlerapp/deltoids", rev = "b1558f1aec39ed4f3d1a76988d563423579e8c12", default-features = false, features = [
    "lang-c",
    "lang-css",
    "lang-go",
    "lang-hcl",
    "lang-java",
    "lang-javascript",
    "lang-json",
    "lang-lua",
    "lang-markdown",
    "lang-python",
    "lang-rust",
    "lang-toml",
    "lang-typescript",
    "lang-yaml",
] }
# Pull request descriptions as formatted text. Only its parser: none of its HTML output.
pulldown-cmark = { version = "0.13.4", default-features = false }

[dependencies]
anyhow.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
unicode-segmentation.workspace = true
bstr.workspace = true
# The forge cache's timestamps.
chrono = { workspace = true, features = ["clock"] }
gix = { workspace = true, features = ["sha1"] }
reqwest.workspace = true
md5.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
# Locks that can't be poisoned, so taking one can't fail.
parking_lot.workspace = true

# GitButler, consumed only from `src/backend`.
but-action.workspace = true
but-api = { workspace = true, features = ["legacy"] }
but-branches.workspace = true
but-askpass.workspace = true
but-bitbucket.workspace = true
but-core.workspace = true
but-error.workspace = true
but-forge.workspace = true
but-github.workspace = true
but-gitlab.workspace = true
but-llm.workspace = true
but-ctx = { workspace = true, features = ["legacy"] }
but-path.workspace = true
but-oplog.workspace = true
but-rebase.workspace = true
but-secret.workspace = true
but-settings.workspace = true
but-transaction.workspace = true
but-workspace = { workspace = true, features = ["legacy"] }
gitbutler-operating-modes.workspace = true
gitbutler-project.workspace = true
gitbutler-repo.workspace = true
gitbutler-filemonitor.workspace = true

[dev-dependencies]
tempfile.workspace = true

