[package]
name = "but-api-macros-tests"
version = "0.0.0"
edition.workspace = true
authors.workspace = true
publish = false
rust-version.workspace = true

[lib]
doctest = false

[features]
default = []
legacy = ["but-ctx/legacy"]
tauri = ["dep:tauri", "legacy"]

[dependencies]
but-api-macros = { path = ".." }
but-error.workspace = true
but-ctx.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
gix.workspace = true
futures.workspace = true
bstr = { workspace = true, features = ["serde"] }
tauri = { version = "^2.10.3", features = ["unstable"], optional = true, default-features = false }

[dev-dependencies]
trybuild = "1.0.114"

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["futures", "tauri", "but-error"]
