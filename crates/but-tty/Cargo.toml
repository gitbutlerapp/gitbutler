[package]
name = "but-tty"
version = "0.0.0"
edition.workspace = true
repository.workspace = true
authors.workspace = true
license-file = "../../LICENSE.md"
description = "A terminal without a screen: the user's shell on a pseudo-terminal, emulated by rustty-vt"
publish = false

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# The pseudoconsole and the shell started on it.
windows = { version = "0.62.0", features = ["Win32_Security", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dependencies]
anyhow.workspace = true
futures.workspace = true
# What the emulator's thread shows, read by the UI's: a lock that can't be poisoned.
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rustty-vt = { git = "https://github.com/Byron/rustty", branch = "rustty" }

[dev-dependencies]
tempfile.workspace = true
