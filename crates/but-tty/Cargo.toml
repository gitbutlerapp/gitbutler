[package]
name = "but-tty"
version = "0.0.0"
edition.workspace = true
repository.workspace = true
authors.workspace = true
license-file = "../../LICENSE.md"
description = "A terminal without a screen: the user's shell on a pseudo-terminal, emulated by libghostty-vt"
publish = false

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# The pseudoconsole and the shell started on it.
windows = { version = "0.62.0", features = ["Win32_Security", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dependencies]
anyhow.workspace = true
futures.workspace = true
# What the emulator's thread shows, read by the UI's: a lock that can't be poisoned.
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Its build compiles Ghostty with Zig 0.17. From master, past 0.2.2, for reading the selection
# back to copy it.
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "9ede35b8ea94a55ed3608408d67e102883129f1e" }

[dev-dependencies]
tempfile.workspace = true
