[package]
name = "gitbutler-repo"
version = "0.0.0"
edition.workspace = true
authors.workspace = true
publish = false
rust-version.workspace = true

[lib]
doctest = false

[features]
## Generate JSON schemas for TypeScript type generation via schemars.
export-schema = ["dep:schemars", "dep:but-schemars"]

[dependencies]
but-core = { workspace = true, features = ["legacy"] }
but-gerrit.workspace = true
but-oxidize.workspace = true
but-ctx = { workspace = true, features = ["legacy"] }
but-schemars = { workspace = true, optional = true }

gitbutler-project.workspace = true
gitbutler-reference.workspace = true

git2.workspace = true
git2-hooks.workspace = true
gix = { workspace = true, features = ["merge", "status", "tree-editor"] }
anyhow.workspace = true
bstr.workspace = true
tracing.workspace = true
tempfile.workspace = true
serde.workspace = true
schemars = { workspace = true, optional = true }
itertools.workspace = true
base64 = "0.22.1"
infer = "0.19.0"
scopeguard = "1.2.0"
fuzzy-matcher = "0.3.7"
ignore = "0.4.25"

[dev-dependencies]
but-testsupport.workspace = true
but-settings.workspace = true
snapbox.workspace = true

[lints]
workspace = true
