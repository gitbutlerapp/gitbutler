[package]
name = "gitbutler-branch-actions"
version = "0.0.0"
edition.workspace = true
authors.workspace = true
publish = false
rust-version.workspace = true

[lib]
doctest = false

[features]
export-schema = [
  "but-workspace/export-schema",
  "gitbutler-project/export-schema",
  "gitbutler-branch/export-schema",
  "dep:schemars",
  "dep:but-schemars",
]

[dependencies]
but-error.workspace = true
but-forge.workspace = true
but-serde = { workspace = true, features = ["legacy"] }
but-workspace = { workspace = true, features = ["legacy"] }
but-core = { workspace = true, features = ["legacy"] }
but-graph = { workspace = true, features = ["legacy"] }
but-oxidize.workspace = true
but-ctx = { workspace = true, features = ["legacy"] }
but-meta = { workspace = true, features = ["legacy"] }

gitbutler-oplog.workspace = true
gitbutler-repo.workspace = true
gitbutler-branch.workspace = true
gitbutler-reference.workspace = true
gitbutler-commit.workspace = true
gitbutler-operating-modes.workspace = true
gitbutler-project.workspace = true

tracing.workspace = true
anyhow.workspace = true
gix = { workspace = true, features = ["blob-diff", "revision"] }
serde.workspace = true
bstr.workspace = true
url = { version = "2.5.4", features = ["serde"] }
md5.workspace = true
schemars = { workspace = true, optional = true }
but-schemars = { workspace = true, optional = true }

[dev-dependencies]
but-askpass.workspace = true
but-project-handle.workspace = true
but-rebase.workspace = true
but-settings.workspace = true
pretty_assertions = "1.4"
but-graph.workspace = true
but-testsupport.workspace = true
gitbutler-workspace.workspace = true
gix = { workspace = true, features = [] }
tempfile.workspace = true
ctor = "0.6.3"
snapbox.workspace = true

[lints]
workspace = true
