[package]
name = "but-transaction"
version = "0.0.0"
edition.workspace = true
authors.workspace = true
publish = false
rust-version.workspace = true

[lib]
doctest = true

[features]
## Switch [`WorkspaceState`] from the legacy `RefInfo` projection to the
## graph-based `DetailedGraphWorkspace` projection.
##
## This changes the shape of a public type, so it must stay coherent across one
## build: never enable it in any crate's default features. Enable it through
## `but-api`'s `graph-workspace` feature, which forwards here; enabling only this
## one leaves `but-api`'s JSON types on the other shape and fails to compile.
graph-workspace = []

[dependencies]
but-ctx.workspace = true
but-db.workspace = true
but-forge.workspace = true
but-oplog.workspace = true
but-core.workspace = true
but-workspace.workspace = true
but-rebase.workspace = true
but-graph.workspace = true

gix.workspace = true
anyhow.workspace = true
bstr.workspace = true
tracing.workspace = true

[dev-dependencies]
but-api = { workspace = true, features = ["legacy"] }
but-testsupport = { workspace = true, features = ["sandbox-but-api"] }

snapbox = { workspace = true }

[lints]
workspace = true
