[package]
name = "but-transaction"
version = "0.0.0"
edition.workspace = true
authors.workspace = true
publish = false
rust-version.workspace = true

[lib]
doctest = true

[features]
## Running transactions in single-branch mode, which sets up the workspace with legacy code.
legacy = ["dep:gitbutler-branch-actions"]

[dependencies]
but-api.workspace = true
but-ctx.workspace = true
but-error.workspace = true
but-oplog.workspace = true
but-core.workspace = true
but-workspace.workspace = true
but-rebase.workspace = true
but-graph.workspace = true
gitbutler-branch-actions = { workspace = true, optional = true }

gix.workspace = true
anyhow.workspace = true
bstr.workspace = true
tracing.workspace = true

[dev-dependencies]
but-api = { workspace = true, features = ["legacy"] }
but-testsupport = { workspace = true, features = ["sandbox-but-api"] }

snapbox = { workspace = true }

[lints]
workspace = true
