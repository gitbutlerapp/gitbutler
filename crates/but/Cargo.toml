[package]
name = "but"
version = "0.0.0"
edition.workspace = true
repository.workspace = true
license-file = "../../LICENSE.md"
description = "A GitButler CLI tool"
authors.workspace = true
readme = "../../README.md"
publish = false
rust-version.workspace = true

[[bin]]
name = "but"
path = "src/main.rs"
doctest = false

[features]
## Experimental commands and features, enabled only for nightly releases in CI.
nightly = ["dep:but-ui-control"]
## A very specific utility flag to make clear that the 'but' binary is managed by a package manager.
## When set, the CLI cannot self-manage itself and commands like `but update install` are disabled.
packaged-but-distribution = []
## Switch mutation responses to the graph-based workspace projection.
## Forwarded to `but-api`; never enable by default. See `but-api`'s feature docs.
graph-workspace = ["but-api/graph-workspace"]
# Feature that enables profiling related features of the TUI.
tui-profiling = ["dep:allocation-counter"]
# Outputs help sections exactly as written, instead of putting them through clap's Markdown formatter. This is useful e.g. for generating docs for the website.
raw-clap-docs = []

[dependencies]
but-core.workspace = true
but-settings.workspace = true
but-secret.workspace = true
but-askpass.workspace = true
but-update.workspace = true
but-installer.workspace = true
but-path.workspace = true
but-ctx = { workspace = true, features = ["legacy"] }
but-project-handle.workspace = true
but-rebase.workspace = true
but-github.workspace = true
but-gitlab.workspace = true
but-bitbucket.workspace = true
but-forge.workspace = true
but-forge-storage.workspace = true
but-workspace = { workspace = true, features = ["legacy"] }
but-api = { workspace = true, features = ["path-bytes", "legacy"] }
but-graph.workspace = true
but-hunk-dependency.workspace = true
but-meta.workspace = true
but-llm.workspace = true
but-agentlog.workspace = true
but-transaction = { workspace = true, features = ["legacy"] }
but-comments.workspace = true
but-db.workspace = true
but-error.workspace = true
but-utils.workspace = true
but-hunk-assignment.workspace = true
but-gerrit.workspace = true
gitbutler-project.workspace = true
gitbutler-branch-actions.workspace = true
gitbutler-oplog.workspace = true
gitbutler-edit-mode.workspace = true
gitbutler-operating-modes.workspace = true
gitbutler-repo.workspace = true
gitbutler-git.workspace = true
gitbutler-watcher.workspace = true

schemars.workspace = true
posthog-rs.workspace = true
serde.workspace = true
shell-words.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "io-std"] }
strum = { version = "0.27", features = ["derive"] }
clap = { workspace = true, features = [
    "env",
    "wrap_help",
    "color",
    "error-context",
    "usage",
    "suggestions",
] }
clap_complete = "4.6.2"
chrono.workspace = true
bstr.workspace = true
anyhow.workspace = true
rmcp.workspace = true
but-ui-control = { workspace = true, optional = true }
url.workspace = true
command-group = { version = "5.0.1", features = ["with-tokio"] }
gix = { workspace = true, features = ["tracing", "tracing-detail"] }
colored = "3.0.0"
serde_json.workspace = true
boolean-enums.workspace = true
terminal_size = "0.4.4"
terminal-colorsaurus = "1.0.0"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "std",
    "fmt",
] }
tracing-forest.workspace = true
dirs.workspace = true
minus = { git = "https://github.com/arijit79/minus", rev = "57f1848f831d153a10d65060562ce1fdde938a01", default-features = false, features = [
    "static_output",
    "search",
] }
unicode-width = "0.2"
ratatui = { workspace = true, features = [
    "unstable-rendered-line-info",
    "palette",
    "serde",
] }
crossterm.workspace = true
tempfile.workspace = true
nonempty.workspace = true
itertools.workspace = true
rand.workspace = true
ratatui-textarea = "0.8.0"
arboard = { version = "3.6.1", default-features = false }
textwrap = "0.16.2"
syntect = { version = "5.3.0", default-features = false, features = [
    "default-themes",
    "regex-onig",
    "metadata",
    "html",
] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
tracing-appender = "0.2.5"
fuzzy-matcher = "0.3.7"
indexmap.workspace = true
allocation-counter = { version = "0.8.1", optional = true }
ansi-to-tui = "8.0.1"

[dev-dependencies]
but-graph.workspace = true
but-ui-control.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
but-testsupport = { workspace = true, features = ["sandbox-but-api"] }
snapbox = { workspace = true, features = ["term-svg"] }
shell-words.workspace = true
temp-env = "0.3"
serial_test = "3.2.0"
syn = { version = "2.0", features = ["visit", "full", "extra-traits", "parsing", "printing"] }
quote = "1.0"

[lints]
workspace = true
