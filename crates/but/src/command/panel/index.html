<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>workspace</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #fbfbfa;
				--raised: #ffffff;
				--fg: #21201d;
				--muted: #85817a;
				--faint: #a8a49c;
				--rule: #e7e4de;
				--rail: #d8d4cc;
				--accent: #3b7de0;
				--ok: #2f8f56;
				--warn: #b5852a;
				--bad: #cc4436;
				--add-bg: #e4f5e9;
				--add-fg: #1d6b3c;
				--del-bg: #fdeaea;
				--del-fg: #a83a2e;
				--chip: #f0ede8;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #191817;
					--raised: #221f1e;
					--fg: #e9e5df;
					--muted: #948f88;
					--faint: #6e6a64;
					--rule: #322e2a;
					--rail: #423d37;
					--accent: #7aa9f2;
					--ok: #63c187;
					--warn: #d6ab5c;
					--bad: #e8796a;
					--add-bg: #16301f;
					--add-fg: #7fcf9b;
					--del-bg: #35191a;
					--del-fg: #ec8d81;
					--chip: #2b2724;
				}
			}

			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--fg);
				font:
					13px/1.45 -apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					system-ui,
					sans-serif;
				-webkit-font-smoothing: antialiased;
			}

			header {
				position: sticky;
				top: 0;
				z-index: 5;
				background: var(--bg);
				border-bottom: 1px solid var(--rule);
				padding: 9px 12px;
				display: flex;
				flex-direction: column;
				gap: 2px;
			}
			.hrow {
				display: flex;
				align-items: center;
				gap: 7px;
			}
			.repo {
				font: inherit;
				font-weight: 650;
				letter-spacing: 0.01em;
				color: inherit;
				background: none;
				border: 0;
				border-radius: 5px;
				padding: 2px 4px;
				margin-left: -4px;
				max-width: 100%;
				min-width: 0;
				/* As wide as the project shown, not the longest one listed. */
				field-sizing: content;
				cursor: pointer;
			}
			.repo:hover {
				background: var(--chip);
			}
			.dot {
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: var(--ok);
				flex: none;
			}
			.dot.bad {
				background: var(--bad);
			}
			.sub {
				color: var(--muted);
				font-size: 11px;
				display: flex;
				align-items: center;
				gap: 6px;
				flex-wrap: wrap;
			}
			.spacer {
				margin-left: auto;
			}
			button.ghost {
				border: 0;
				background: none;
				color: var(--muted);
				cursor: pointer;
				padding: 2px 4px;
				border-radius: 4px;
				font: inherit;
				font-size: 11px;
			}
			button.ghost:hover {
				background: var(--chip);
				color: var(--fg);
			}

			main {
				padding: 6px 0 40px;
			}
			.err {
				margin: 10px 12px;
				padding: 9px 11px;
				border-radius: 7px;
				background: var(--del-bg);
				color: var(--del-fg);
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 11px;
				white-space: pre-wrap;
			}

			section.card {
				margin: 6px 8px;
				background: var(--raised);
				border: 1px solid var(--rule);
				border-radius: 9px;
				overflow: hidden;
			}
			/* Branches stacked on each other share a rail, top branch first. */
			.stack {
				margin: 6px 8px;
				padding-left: 6px;
				border-left: 2px solid var(--rail);
			}
			.stack > .card {
				margin: 0 0 4px;
			}
			.stack > .card:last-child {
				margin-bottom: 0;
			}
			.stack-label {
				padding: 0 0 3px 4px;
				color: var(--faint);
				font-size: 10.5px;
				font-weight: 600;
				letter-spacing: 0.04em;
				text-transform: uppercase;
			}

			/* Rows ------------------------------------------------------------ */
			.row {
				display: flex;
				align-items: flex-start;
				gap: 7px;
				width: 100%;
				text-align: left;
				border: 0;
				background: none;
				color: inherit;
				font: inherit;
				padding: 7px 10px;
				cursor: pointer;
			}
			.row:hover {
				background: var(--chip);
			}
			.row .tw {
				flex: none;
				width: 9px;
				color: var(--faint);
				font-size: 9px;
				line-height: 1.7;
				transition: transform 0.12s ease;
			}
			.row.open .tw {
				transform: rotate(90deg);
			}
			.grow {
				min-width: 0;
				flex: 1;
			}
			.clip {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.wrap {
				overflow-wrap: anywhere;
			}

			.branch .name {
				font-weight: 620;
			}
			.meta {
				color: var(--muted);
				font-size: 11px;
				display: flex;
				align-items: center;
				gap: 6px;
				flex-wrap: wrap;
				margin-top: 1px;
			}
			a.pr {
				color: var(--accent);
				text-decoration: none;
			}
			a.pr:hover {
				text-decoration: underline;
			}

			/* Commits --------------------------------------------------------- */
			.commits {
				border-top: 1px solid var(--rule);
			}
			.commit {
				position: relative;
				padding-left: 26px;
			}
			/* The rail and node echo the client's stack graph. */
			.commit::before {
				content: "";
				position: absolute;
				left: 15px;
				top: 0;
				bottom: 0;
				width: 1px;
				background: var(--rail);
			}
			.commit:last-of-type::before {
				bottom: auto;
				height: 15px;
			}
			.commit::after {
				content: "";
				position: absolute;
				left: 12px;
				top: 11px;
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: var(--raised);
				border: 1.5px solid var(--rail);
			}
			.commit.pushed::after {
				background: var(--rail);
			}
			.commit.conflicted::after {
				border-color: var(--bad);
				background: var(--bad);
			}

			.id {
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 10.5px;
				color: var(--faint);
				background: var(--chip);
				padding: 0 4px;
				border-radius: 3px;
			}
			.body {
				padding: 0 10px 9px 26px;
				color: var(--muted);
				font-size: 11.5px;
			}
			.body pre.msg {
				margin: 0 0 8px;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
				font: inherit;
				color: var(--fg);
				opacity: 0.85;
			}

			/* Files and diffs -------------------------------------------------- */
			.file {
				padding: 5px 10px 5px 26px;
				gap: 6px;
				font-size: 11.5px;
			}
			.file .st {
				flex: none;
				width: 11px;
				text-align: center;
				font-family: ui-monospace, Menlo, monospace;
				font-size: 10px;
				font-weight: 700;
			}
			.st.added {
				color: var(--ok);
			}
			.st.modified {
				color: var(--warn);
			}
			.st.removed {
				color: var(--bad);
			}
			.st.renamed {
				color: var(--accent);
			}
			.path {
				direction: rtl;
				text-align: left;
			}
			.stat {
				flex: none;
				font-family: ui-monospace, Menlo, monospace;
				font-size: 10px;
				color: var(--muted);
			}
			.stat .p {
				color: var(--add-fg);
			}
			.stat .m {
				color: var(--del-fg);
			}

			.diff {
				margin: 0 10px 8px 26px;
				border: 1px solid var(--rule);
				border-radius: 6px;
				overflow-x: auto;
				background: var(--bg);
			}
			.diff pre {
				margin: 0;
				font:
					11px/1.5 ui-monospace,
					SFMono-Regular,
					Menlo,
					monospace;
				white-space: pre;
				/* This codebase indents with tabs; 2 keeps diffs readable in a narrow column. */
				tab-size: 2;
			}
			.diff .ln {
				display: block;
				padding: 0 8px;
			}
			.diff .ln.a {
				background: var(--add-bg);
				color: var(--add-fg);
			}
			.diff .ln.d {
				background: var(--del-bg);
				color: var(--del-fg);
			}
			.diff .ln.h {
				color: var(--faint);
				background: var(--chip);
			}
			.loading {
				padding: 6px 10px 8px 26px;
				color: var(--faint);
				font-size: 11px;
			}

			.empty {
				padding: 10px;
				color: var(--faint);
				font-size: 11.5px;
			}
			.section {
				margin: 18px 12px 4px;
				color: var(--muted);
				font-size: 11px;
				font-weight: 600;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				display: flex;
				gap: 6px;
				align-items: baseline;
			}
			.search {
				margin-top: 6px;
				width: 100%;
				font: inherit;
				font-size: 12px;
				color: var(--fg);
				background: var(--raised);
				border: 1px solid var(--rule);
				border-radius: 6px;
				padding: 5px 8px;
				outline: none;
			}
			.search:focus {
				border-color: var(--accent);
			}
			.group {
				display: flex;
				flex-direction: column;
				gap: 1px;
				padding: 7px 10px 5px;
				border-bottom: 1px solid var(--rule);
			}
			.group .name {
				font-weight: 620;
			}
			.menu {
				position: fixed;
				z-index: 20;
				min-width: 180px;
				max-width: min(320px, calc(100vw - 8px));
				padding: 4px;
				background: var(--raised);
				border: 1px solid var(--rule);
				border-radius: 8px;
				box-shadow: 0 6px 24px rgb(0 0 0 / 0.16);
			}
			.menu-title {
				padding: 4px 8px 2px;
				color: var(--muted);
				font-size: 11px;
			}
			/* A path clips at its start, so the file name stays visible. */
			.menu-title.path {
				direction: rtl;
				text-align: left;
			}
			.menu-label {
				padding: 6px 8px 2px;
				color: var(--faint);
				font-size: 10.5px;
				font-weight: 600;
				letter-spacing: 0.04em;
				text-transform: uppercase;
			}
			.menu-item {
				display: block;
				width: 100%;
				text-align: left;
				font: inherit;
				color: inherit;
				background: none;
				border: 0;
				border-radius: 5px;
				padding: 5px 8px;
				cursor: pointer;
			}
			.menu-item:hover {
				background: var(--chip);
			}
			.menu-note {
				padding: 5px 8px;
				color: var(--faint);
				font-size: 11.5px;
			}
			.err-text {
				color: var(--bad);
			}
			.toast {
				position: fixed;
				z-index: 30;
				left: 50%;
				bottom: 12px;
				transform: translateX(-50%);
				max-width: calc(100vw - 24px);
				padding: 6px 12px;
				border-radius: 7px;
				font-size: 12px;
				color: var(--bg);
				background: var(--fg);
				box-shadow: 0 4px 16px rgb(0 0 0 / 0.18);
			}
			.toast.bad {
				color: #fff;
				background: var(--bad);
			}
			.base {
				margin: 10px 12px 0;
				padding-top: 9px;
				border-top: 1px solid var(--rule);
				color: var(--muted);
				font-size: 11px;
				display: flex;
				gap: 6px;
			}
			.base .behind {
				color: var(--warn);
				white-space: nowrap;
			}
		</style>
	</head>
	<body>
		<header>
			<div class="hrow">
				<span class="dot" id="dot"></span>
				<select class="repo" id="repo" title="Switch project"><option>…</option></select>
				<span class="spacer"></span>
				<button class="ghost" id="fetch" title="Fetch from the remotes">⇣ Fetch</button>
				<button class="ghost" id="refresh" title="Refresh now">⟳</button>
				<button class="ghost" id="more" title="Project menu">⋯</button>
			</div>
			<div class="sub" id="sub"></div>
			<input class="search" id="search" type="search" placeholder="Search files in commits (/)" autocomplete="off" spellcheck="false" />
		</header>
		<main id="tree"></main>
		<div class="menu" id="menu" hidden></div>
		<div class="toast" id="toast" hidden></div>
		<script type="module" src="./app.js"></script>
	</body>
</html>
