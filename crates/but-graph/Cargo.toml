[package]
name = "but-graph"
version = "0.0.0"
edition.workspace = true
authors.workspace = true
description = "Types to represent Git commit graphs as connected segments, and perform various operations on these."
publish = false
rust-version.workspace = true

[package.metadata.cargo-machete]
ignored = [
    # Imported as `renderdag` (the crate's lib name), which machete misses.
    "sapling-renderdag",
]

[lib]
doctest = false

[features]
## Gate functions we only need to help `gitbutler-` crates along,
## slated for culling or review before promotion to non-legacy
legacy = []
[dependencies]
but-core.workspace = true
but-db.workspace = true

gix = { workspace = true, features = ["revision"] }
bstr.workspace = true
anyhow.workspace = true
bitflags.workspace = true
boolean-enums.workspace = true
tracing.workspace = true

[dev-dependencies]
but-meta = { workspace = true, features = ["legacy"] }
but-testsupport.workspace = true
termtree = "0.5.1"

gitbutler-reference.workspace = true
snapbox.workspace = true
sapling-renderdag.workspace = true

[lints]
workspace = true
