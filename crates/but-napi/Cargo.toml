[package]
name = "but-napi"
version = "0.0.0"
edition.workspace = true
repository.workspace = true
license-file = "../../LICENSE.md"
description = "GitButler Node.js SDK via napi-rs"
authors.workspace = true
readme = "../../README.md"
publish = false
rust-version.workspace = true

[package.metadata.cargo-machete]
ignored = [
    # Consumed via napi attribute macros and generated bindings that machete misses.
    "napi",
    # Consumed via napi attribute macros and generated bindings that machete misses.
    "napi-derive",
]

[lib]
crate-type = ["cdylib"]

[features]
default = ["legacy", "napi-auto"]
## Make legacy functionality available - required for most operations.
legacy = ["but-api/legacy"]
## Enable auto-generated napi functions from the `#[but_api]` macro.
napi-auto = ["but-api/napi"]
## Switch mutation responses to the graph-based workspace projection.
## Forwarded to `but-api`; never enable by default. See `but-api`'s feature docs.
## The SDK builds one `.node` binary per flavor: this feature is enabled for the
## `@gitbutler/but-sdk/graph` entry point's binary and off for the default one.
graph-workspace = ["but-api/graph-workspace"]

[dependencies]
anyhow.workspace = true
but-askpass.workspace = true
but-api.workspace = true
but-core.workspace = true
but-ctx.workspace = true
but-llm.workspace = true
but-path.workspace = true
but-secret.workspace = true
but-settings.workspace = true
gix.workspace = true
gitbutler-watcher.workspace = true
napi = { version = "3", features = ["serde-json", "tokio_rt"] }
napi-derive = "3"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true

[build-dependencies]
napi-build = "2"
