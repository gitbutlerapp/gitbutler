[package]
name = "but-meta"
version = "0.0.0"
edition.workspace = true
authors.workspace = true
description = "Database metadata maintenance and legacy oplog payload conversion"
publish = false
rust-version.workspace = true

[lib]
doctest = false
test = false

[features]
legacy = [
    "dep:but-db",
    "dep:but-serde",
    "dep:gitbutler-reference",
    "dep:serde",
    "dep:md5",
    "dep:hex",
    "dep:gix",
]

[dependencies]
but-core.workspace = true
but-db = { workspace = true, optional = true }
but-serde = { workspace = true, optional = true }

gitbutler-reference = { workspace = true, optional = true }

anyhow.workspace = true

gix = { workspace = true, features = ["revision"], optional = true }
serde = { workspace = true, optional = true }
md5 = { workspace = true, optional = true }
hex = { version = "0.4.3", optional = true }

[dev-dependencies]
toml.workspace = true
but-meta = { workspace = true, features = ["legacy"] }
but-testsupport.workspace = true

snapbox.workspace = true


[lints]
workspace = true
