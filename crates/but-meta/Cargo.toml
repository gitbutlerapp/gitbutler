[package]
name = "but-meta"
version = "0.0.0"
edition.workspace = true
authors.workspace = true
description = "Legacy metadata compatibility adapters"
publish = false
rust-version.workspace = true

[lib]
doctest = false
test = false

[features]
legacy = ["dep:but-db", "dep:gix"]

[dependencies]
but-core.workspace = true
but-db = { workspace = true, optional = true }

anyhow.workspace = true

gix = { workspace = true, features = ["revision"], optional = true }

[dev-dependencies]
toml.workspace = true
but-meta = { workspace = true, features = ["legacy"] }
but-testsupport.workspace = true


[lints]
workspace = true
